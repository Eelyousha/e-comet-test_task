[project]
name = "github-scraper"
version = "0.1.0"
description = "GitHub top repositories scraper with ClickHouse storage"
requires-python = ">=3.12"

dependencies = [
    "aiohttp>=3.9",
    "clickhouse-connect>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true